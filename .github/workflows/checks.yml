name: MVP checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: soglasovano
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: soglasovano
        ports: ["55477:5432"]
        options: >-
          --health-cmd "pg_isready -U soglasovano"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://soglasovano:ci_only@localhost:55477/soglasovano
      TEST_DATABASE_URL: postgresql://soglasovano:ci_only@localhost:55477/soglasovano_test
      BETTER_AUTH_SECRET: ci-only-not-for-production-sessions-2026
      BETTER_AUTH_URL: http://localhost:3077
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: psql "$DATABASE_URL" -c 'CREATE DATABASE soglasovano_test'
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
