services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: soglasovano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: soglasovano
      TZ: UTC
    ports:
      - "127.0.0.1:55477:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soglasovano"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
